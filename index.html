<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة نتيجة يومية ومواقيت الصلاة - القاهرة</title>
    <!-- استدعاء خطوط عربية فاخرة وواضحة من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --navy-dark: #0A1B36;
            --navy-main: #0F2342;
            --navy-light: #1B365D;
            --gold-dark: #A67C2E;
            --gold-main: #C9A24B;
            --gold-light: #E8CF88;
            --gold-pale: #F6E6B4;
            --ivory-bg: #FAF7F0;
            --cream-card: #F5EFE2;
            --cream-deep: #EAE0CC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            background-color: #1E242B;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }

        /* حاوية التحكم العلوية للطباعة والمعاينة */
        .toolbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 10px 20px;
            background: rgba(15, 35, 66, 0.9);
            border: 1px solid var(--gold-main);
            border-radius: 12px;
            color: #FAF7F0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            color: #0A1B36;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--gold-light);
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        .btn-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(201, 162, 75, 0.45);
            filter: brightness(1.06);
        }

        .desktop-governorate-picker { position: relative; min-width: 150px; }
        .desktop-governorate-button {
            width: 100%; min-height: 42px; display: flex;
            align-items: center; justify-content: space-between;
            gap: 12px; cursor: pointer; text-align: right;
            background: rgba(250,247,240,.12); color: #FAF7F0;
            border: 1px solid var(--gold-main); border-radius: 8px;
            padding: 8px 12px; font: inherit;
        }
        .desktop-governorate-dropdown {
            position: absolute; top: calc(100% + 6px); right: 0;
            width: 230px; z-index: 1000; padding: 8px;
            border: 1px solid var(--gold-main); border-radius: 10px;
            background: #0A1B36; box-shadow: 0 10px 24px rgba(0,0,0,.4);
        }
        .desktop-governorate-dropdown[hidden] { display: none !important; }
        .desktop-governorate-search {
            box-sizing: border-box; width: 100%; min-height: 40px;
            margin-bottom: 7px; padding: 8px 10px; direction: rtl;
            text-align: right; color: #FAF7F0;
            background: rgba(250,247,240,.10);
            border: 1px solid var(--gold-main); border-radius: 7px;
        }
        .desktop-governorate-options { max-height: 260px; overflow-y: auto; }
        .desktop-governorate-option {
            display: block; width: 100%; padding: 8px 10px;
            border: 0; border-bottom: 1px solid rgba(201,162,75,.2);
            background: transparent; color: #FAF7F0; text-align: right;
            font: inherit; cursor: pointer;
        }
        .desktop-governorate-option:hover,
        .desktop-governorate-option[aria-selected="true"] {
            background: rgba(201,162,75,.18); color: var(--gold-light);
        }
        .desktop-governorate-empty { padding: 10px; color: #FAF7F0; text-align: center; }

        /* الحاوية المتجاوبة التي تحافظ على نسبة 3:2 بدقة 1536x1024 */
        .sheet-wrapper {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 3 / 2;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--ivory-bg);
        }

        /* لوحة التصميم الأساسية بأبعاد ثابتة 1536x1024 يتم تحجيمها تلقائياً */
        .calendar-sheet {
            width: 1536px;
            height: 1024px;
            position: absolute;
            top: 0;
            right: 0;
            transform-origin: top right;
            background-color: var(--ivory-bg);
            overflow: hidden;
            user-select: none;
        }

        /* خلفية النقوش الهندسية الإسلامية الدقيقة */
        .islamic-pattern-bg {
            position: absolute;
            inset: 0;
            opacity: 0.055;
            pointer-events: none;
            z-index: 1;
        }

        /* تدرج إضاءة ناعم لإعطاء عمق للورقة */
        .ambient-lighting {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.65) 0%, rgba(235, 224, 200, 0.35) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* الإطار الخارجي المزدوج */
        .outer-frame-navy {
            position: absolute;
            inset: 22px;
            border: 3px solid var(--navy-main);
            border-radius: 14px;
            pointer-events: none;
            z-index: 10;
        }

        .outer-frame-gold {
            position: absolute;
            inset: 29px;
            border: 2px solid var(--gold-main);
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }

        /* زخارف الأركان الأربعة */
        .corner-ornament {
            position: absolute;
            width: 115px;
            height: 115px;
            z-index: 12;
            pointer-events: none;
        }
        .corner-tr { top: 20px; right: 20px; }
        .corner-tl { top: 20px; left: 20px; transform: scaleX(-1); }
        .corner-br { bottom: 20px; right: 20px; transform: scaleY(-1); }
        .corner-bl { bottom: 20px; left: 20px; transform: scale(-1, -1); }

        /* 1. اللوحة الرئيسية - الجمعة (X: 32% إلى 68%, Y: 3% إلى 37%) */
        .friday-section {
            position: absolute;
            left: 31.5%;
            width: 37%;
            top: 3.2%;
            height: 34.5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 15;
        }

        .friday-plaque-container {
            position: relative;
            width: 100%;
            height: 245px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 14px 24px rgba(10, 27, 54, 0.28));
        }

        .friday-title {
            position: relative;
            z-index: 5;
            font-family: 'Amiri', serif;
            font-size: 138px;
            font-weight: 700;
            color: #FCF9F2;
            line-height: 1;
            margin-top: -12px;
            text-shadow:
                0 3px 0 var(--gold-dark),
                0 6px 18px rgba(201, 162, 75, 0.65),
                0 10px 25px rgba(0, 0, 0, 0.45);
            letter-spacing: 1px;
        }

        /* 2. صناديق التاريخ الهجري والميلادي */
        .date-card {
            position: absolute;
            top: 7.2%;
            height: 49.5%;
            width: 26.5%;
            background: linear-gradient(180deg, #FDFBF7 0%, #F3EBDC 100%);
            border-radius: 24px;
            border: 3px solid var(--gold-main);
            box-shadow:
                0 14px 30px rgba(15, 35, 66, 0.14),
                inset 0 0 0 4px #FAF6EE,
                inset 0 0 0 6px var(--gold-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 15;
        }

        /* التاريخ الهجري (أعلى اليسار X: 4.5% إلى 31%) */
        .hijri-card {
            left: 4.5%;
        }

        /* التاريخ الميلادي (أعلى اليمين X: 69% إلى 95.5%) */
        .gregorian-card {
            right: 4.5%;
        }

        .date-card-header {
            height: 86px;
            margin: 6px 6px 0 6px;
            border-radius: 16px 16px 4px 4px;
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-light) 50%, var(--navy-dark) 100%);
            border-bottom: 3px solid var(--gold-main);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .date-card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px 22px 20px;
            text-align: center;
        }

        /* تكبير أرقام التواريخ بشكل بارز وفخم بناءً على التعديلات المطلوبة */
        .date-day-number {
            font-family: 'Cairo', sans-serif;
            font-size: 168px;
            font-weight: 900;
            color: var(--navy-main);
            line-height: 0.92;
            margin-top: 6px;
            text-shadow: 0 4px 10px rgba(15, 35, 66, 0.12);
        }

        .date-month-name {
            font-family: 'Cairo', sans-serif;
            font-size: 46px;
            font-weight: 800;
            color: var(--navy-dark);
            line-height: 1.15;
        }

        .gold-divider-line {
            width: 78%;
            height: 2.5px;
            background: linear-gradient(90deg, transparent 0%, var(--gold-dark) 20%, var(--gold-main) 50%, var(--gold-dark) 80%, transparent 100%);
            border-radius: 2px;
        }

        .date-year-text {
            font-family: 'Cairo', sans-serif;
            font-size: 48px;
            font-weight: 800;
            color: var(--navy-main);
            line-height: 1.1;
        }

        /* 3. التاريخ القبطي في المنتصف أسفل لوحة الجمعة (Y: 39% إلى 54%) */
        .coptic-section {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 40.5%;
            width: 34%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 15;
        }

        .coptic-text {
            font-family: 'Cairo', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: var(--navy-main);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* 4. جدول مواقيت الصلاة (أكثر تناسقاً لإبراز أرقام التواريخ الكبيرة) */
        .prayer-table-container {
            position: absolute;
            left: 3.8%;
            right: 3.8%;
            top: 61.5%;
            height: 28.2%;
            border-radius: 22px;
            border: 3px solid var(--gold-main);
            box-shadow:
                0 16px 35px rgba(15, 35, 66, 0.16),
                inset 0 0 0 3px #FAF6EE;
            background: linear-gradient(180deg, #FBF8F1 0%, #EFE5D1 100%);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            overflow: hidden;
            z-index: 15;
        }

        .prayer-col {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* فاصل ذهبي رأسي بين الأعمدة الستة */
        .prayer-col:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 8px;
            bottom: 8px;
            left: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-main) 50%, var(--gold-dark) 100%);
            z-index: 5;
        }

        .prayer-header {
            height: 43%;
            background: linear-gradient(180deg, var(--navy-dark) 0%, var(--navy-light) 100%);
            border-bottom: 3px solid var(--gold-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px;
        }

        .prayer-icon {
            width: 44px;
            height: 44px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
        }

        .prayer-name {
            font-family: 'Cairo', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.1;
        }

        .prayer-time-cell {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 4px;
        }

        .prayer-time-value {
            font-family: 'Cairo', sans-serif;
            font-size: 54px;
            font-weight: 900;
            color: var(--navy-main);
            line-height: 1.05;
            letter-spacing: 0.5px;
        }

        .prayer-period {
            font-family: 'Cairo', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--navy-light);
            margin-top: 2px;
            line-height: 1;
        }

        /* 5. الزخرفة الذهبية السفلية في المنتصف */
        .bottom-center-ornament {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            height: 32px;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* إعدادات الطباعة الاحترافية */
        @media print {
            @page {
                size: landscape;
                margin: 0;
            }
            body {
                background: #FFFFFF;
                padding: 0;
                margin: 0;
                min-height: auto;
            }
            .toolbar {
                display: none !important;
            }
            .sheet-wrapper {
                max-width: 100%;
                width: 100vw;
                height: 100vh;
                box-shadow: none;
                border-radius: 0;
            }
        }


        /* وضع الشاشات الذكية: مساحة عرض كاملة مع الحفاظ على ورقة 3:2 */
        body.smart-tv-mode {
            min-height: 100vh;
            padding: 18px 24px;
            justify-content: center;
            gap: 0;
        }
        body.smart-tv-mode .toolbar {
            width: auto;
            max-width: none;
            min-height: 64px;
            margin-bottom: 14px;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 18px;
        }
        body.smart-tv-mode .toolbar button,
        body.smart-tv-mode .toolbar select,
        body.smart-tv-mode .toolbar input {
            min-height: 48px;
            font-size: 18px;
        }
        body.smart-tv-mode .sheet-wrapper {
            max-width: none;
            width: auto;
            height: auto;
            aspect-ratio: auto;
            flex: 0 0 auto;
        }
        body.smart-tv-mode .calendar-sheet {
            transform-origin: top right;
        }
        body.smart-tv-mode .desktop-governorate-dropdown {
            width: 300px;
            font-size: 18px;
        }
        body.smart-tv-mode .desktop-governorate-search,
        body.smart-tv-mode .desktop-governorate-option {
            min-height: 48px;
            font-size: 18px;
        }
        @media screen and (max-width: 700px) {
            body.smart-tv-mode {
                padding: 10px;
            }
        }

        /* تنسيق منتقي التاريخ في شريط الأدوات */
        .date-picker-input {
            background: rgba(250, 247, 240, 0.12);
            border: 1px solid var(--gold-main);
            color: #FAF7F0;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            color-scheme: dark;
        }
        .btn-outline-gold {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-main);
            padding: 7px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-outline-gold:hover {
            background: rgba(201, 162, 75, 0.18);
        }

        /* زر القائمة مخصص للموبايل فقط حتى لا يتغير تصميم الكمبيوتر */
        .sheet-menu-toggle {
            display: none;
        }

        /* زر القائمة ولوحة الضبط داخل الورقة */
        .sheet-menu-toggle {
            position: absolute;
            top: 145px;
            right: 42px;
            z-index: 40;
            width: 48px;
            height: 48px;
            display: none !important;
            align-items: center;
            justify-content: center;
            color: var(--gold-light);
            background: linear-gradient(145deg, var(--navy-light), var(--navy-dark));
            border: 2px solid var(--gold-main);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(10, 27, 54, 0.2);
            cursor: pointer;
        }

        .sheet-menu-toggle:hover {
            filter: brightness(1.15);
        }

        .sheet-settings-panel[hidden] {
            display: none !important;
        }

        .sheet-settings-panel {
            position: absolute;
            top: 201px;
            right: 42px;
            z-index: 45;
            width: min(300px, calc(100% - 84px));
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #FAF7F0;
            background: linear-gradient(160deg, #1B365D, #0A1B36);
            border: 2px solid var(--gold-main);
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .sheet-settings-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--gold-light);
            font-weight: 800;
            font-size: 17px;
        }

        .sheet-settings-close {
            border: 0;
            background: transparent;
            color: var(--gold-light);
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }

        .sheet-settings-label {
            color: #FAF7F0;
            font-size: 13px;
            font-weight: 700;
        }

        .sheet-settings-panel .date-picker-input {
            width: 100%;
            min-height: 42px;
        }
        .governorate-picker { position: relative; width: 100%; }
        .governorate-picker-button {
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; text-align: right; font: inherit;
        }
        .governorate-dropdown {
            position: absolute; top: calc(100% + 5px); right: 0; left: 0;
            z-index: 100; padding: 8px; border: 1px solid var(--gold-main);
            border-radius: 10px; background: var(--navy-dark);
            box-shadow: 0 10px 24px rgba(0,0,0,.35);
        }
        .governorate-dropdown[hidden] { display: none !important; }
        .governorate-search { box-sizing: border-box; margin-bottom: 7px; }
        .governorate-options { max-height: 190px; overflow-y: auto; }
        .governorate-option {
            display: block; width: 100%; padding: 8px 10px; border: 0;
            border-bottom: 1px solid rgba(201,162,75,.22);
            background: transparent; color: #FAF7F0; text-align: right;
            font: inherit; cursor: pointer;
        }
        .governorate-option:hover,
        .governorate-option[aria-selected="true"] {
            background: rgba(201,162,75,.18); color: var(--gold-light);
        }
        .governorate-empty { padding: 10px; color: #FAF7F0; text-align: center; }
        .prayer-city-heading { display: none; }

        .sheet-settings-actions {
            display: flex;
            gap: 8px;
        }

        .sheet-settings-actions > button {
            flex: 1;
            justify-content: center;
        }

        @media screen and (max-width: 700px) {
            .toolbar { display: none !important; }
            .sheet-menu-toggle {
                display: flex !important;
                top: 70px;
                right: 16px;
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }

            .sheet-menu-toggle svg {
                width: 19px;
                height: 19px;
            }

            .sheet-settings-panel {
                top: 118px;
                right: 16px;
                width: min(280px, calc(100% - 32px));
                padding: 12px;
            }
        }

        @media print {
            .sheet-menu-toggle,
            .sheet-settings-panel {
                display: none !important;
            }
        }


        /* =========================
           تخطيط مستقل للهواتف
           يحافظ على تصميم الطباعة الأصلي
           ========================= */
        @media screen and (max-width: 700px) {
            body {
                justify-content: flex-start;
                padding: 10px;
            }

            .sheet-wrapper {
                width: 100%;
                max-width: 520px;
                aspect-ratio: auto;
                height: auto;
                overflow: visible;
                border-radius: 8px;
            }

            .calendar-sheet {
                position: relative;
                top: auto;
                right: auto;
                width: 100%;
                height: auto;
                min-height: 0;
                transform: none !important;
                transform-origin: top right;
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-areas:
                    "friday friday"
                    "hijri gregorian"
                    "coptic coptic"
                    "cityheading cityheading"
                    "prayers prayers";
                gap: 12px;
                padding: 28px 16px 54px;
                overflow: hidden;
                border-radius: 8px;
            }

            .islamic-pattern-bg,
            .ambient-lighting,
            .outer-frame-navy,
            .outer-frame-gold,
            .corner-ornament,
            .bottom-center-ornament {
                pointer-events: none;
            }

            .outer-frame-navy {
                inset: 7px;
                border-width: 2px;
                border-radius: 10px;
            }

            .outer-frame-gold {
                inset: 12px;
                border-width: 1px;
                border-radius: 7px;
            }

            .corner-ornament {
                width: 54px;
                height: 54px;
            }

            .corner-tr { top: 6px; right: 6px; }
            .corner-tl { top: 6px; left: 6px; }
            .corner-br { bottom: 6px; right: 6px; }
            .corner-bl { bottom: 6px; left: 6px; }

            .friday-section {
                grid-area: friday;
                position: relative;
                left: auto;
                right: auto;
                top: auto;
                width: 100%;
                height: auto;
                min-height: 0;
                gap: 0;
                justify-content: center;
                padding: 2px 18px 0;
            }

            .friday-section > svg:first-child,
            .friday-section > svg:last-child {
                width: min(52%, 180px);
                height: auto;
            }

                max-width: 360px;
                height: clamp(100px, 29vw, 142px);
                filter: drop-shadow(0 7px 12px rgba(10, 27, 54, 0.24));

                font-size: clamp(54px, 15vw, 78px);
                margin-top: -5px;
            }

            .date-card {
                position: relative;
                top: auto;
                left: auto;
                right: auto;
                width: auto;
                height: clamp(176px, 49vw, 220px);
                min-width: 0;
                border-radius: 14px;
                border-width: 2px;
            }

            .hijri-card { grid-area: hijri; }
            .gregorian-card { grid-area: gregorian; }

            .date-card-header {
                height: 42px;
                margin: 4px 4px 0;
                border-radius: 9px 9px 3px 3px;
                border-bottom-width: 2px;
            }

            .date-card-header svg {
                width: 28px;
                height: 28px;
            }

            .date-card-body {
                padding: 7px 5px 10px;
                justify-content: space-evenly;
            }

            .date-day-number {
                font-size: clamp(54px, 15vw, 76px);
                line-height: 0.95;
                margin-top: 0;
            }

            .date-month-name {
                font-size: clamp(16px, 4.5vw, 22px);
                line-height: 1.2;
                overflow-wrap: anywhere;
            }

            .gold-divider-line {
                width: 78%;
                height: 2px;
            }

            .date-year-text {
                font-size: clamp(17px, 4.8vw, 23px);
                line-height: 1.1;
            }

            .coptic-section {
                grid-area: coptic;
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                width: 100%;
                padding: 2px 4px;
            }

            .coptic-text {
                font-size: clamp(18px, 5vw, 25px);
                line-height: 1.35;
                margin-bottom: 3px;
                text-align: center;
            }

            .coptic-section svg {
                width: min(75%, 260px);
                height: auto;
            }

            .prayer-city-heading {
                display: block;
                grid-area: cityheading;
                position: static;
                text-align: center;
                color: var(--navy-main);
                font-size: 20px;
                font-weight: 800;
                line-height: 1.3;
                margin: 0 0 -4px;
            }

            .prayer-table-container {
                grid-area: prayers;
                position: relative;
                left: auto;
                right: auto;
                top: auto;
                width: 100%;
                height: auto;
                min-height: 0;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                border-radius: 14px;
                border-width: 2px;
            }

            .prayer-col {
                min-width: 0;
                min-height: 118px;
                border-bottom: 1px solid rgba(166, 124, 46, 0.45);
            }

            .prayer-col:nth-child(3n + 1),
            .prayer-col:nth-child(3n + 2) {
                border-left: 1px solid rgba(166, 124, 46, 0.45);
            }

            .prayer-col:not(:last-child)::after {
                display: none;
            }

            .prayer-header {
                height: 58px;
                min-height: 58px;
                gap: 2px;
                padding: 4px 2px;
                border-bottom-width: 2px;
            }

            .prayer-icon {
                width: 25px;
                height: 25px;
            }

            .prayer-name {
                font-size: clamp(15px, 4.2vw, 19px);
                line-height: 1.1;
            }

            .prayer-time-cell {
                min-height: 58px;
                padding: 5px 2px;
            }

            .prayer-time-value {
                font-size: clamp(22px, 6.3vw, 30px);
                line-height: 1.1;
                letter-spacing: 0;
            }

            .prayer-period {
                font-size: 15px;
                margin-top: 2px;
            }

            .bottom-center-ornament {
                width: min(68%, 280px);
                height: 22px;
                bottom: 17px;
            }

            .bottom-center-ornament svg {
                width: 100%;
                height: 100%;
            }
        }

        @media screen and (max-width: 360px) {
            body { padding: 6px; }
            .calendar-sheet { padding: 24px 12px 48px; gap: 9px; }
            .date-card { height: 168px; }
            .date-day-number { font-size: 52px; }
            .date-month-name { font-size: 15px; }
            .date-year-text { font-size: 16px; }
            .prayer-col { min-height: 108px; }
            .prayer-header { height: 54px; min-height: 54px; }
            .prayer-time-value { font-size: 21px; }
        }

        @media print {

                width: 1536px;

    <!-- سكريبت التحجيم التلقائي وجلب البيانات الحية لمدينة القاهرة -->
    <script>
        // إظهار وإخفاء أدوات الضبط داخل ورقة الموبايل
        function toggleSettings(forceState) {
            const panel = document.getElementById('settingsPanel');
            const button = document.getElementById('settingsToggle');
            if (!panel || !button) return;
            const shouldOpen = typeof forceState === 'boolean' ? forceState : panel.hidden;

            // مزامنة منتقي تاريخ الموبايل مع التاريخ المعروض حالياً قبل فتح القائمة.
            if (shouldOpen) {
                const desktopDateInput = document.getElementById('dateSelector');
                const mobileDateInput = document.getElementById('mobileDateSelector');
                if (desktopDateInput && mobileDateInput) {
                    mobileDateInput.value = desktopDateInput.value || getCairoTodayValue();
                }
            }

            panel.hidden = !shouldOpen;
            button.setAttribute('aria-expanded', String(shouldOpen));
        }

        function getCairoTodayValue() {
            const cairoToday = getCairoNow();
            const yyyy = cairoToday.getFullYear();
            const mm = String(cairoToday.getMonth() + 1).padStart(2, '0');
            const dd = String(cairoToday.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // تحويل الأرقام الإنجليزية إلى أرقام عربية هندية حصراً
        function toArabicDigits(value) {
            const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(value).replace(/\d/g, d => arabicDigits[Number(d)]);
        }

        // أسماء الأيام والأشهر العربية
        const ARABIC_DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const GREGORIAN_MONTHS = [
            'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
            'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
        ];
        const HIJRI_MONTHS = {
            1: 'محرم',
            2: 'صفر',
            3: 'ربيع الأول',
            4: 'ربيع الآخر',
            5: 'جمادى الأولى',
            6: 'جمادى الآخرة',
            7: 'رجب',
            8: 'شعبان',
            9: 'رمضان',
            10: 'شوال',
            11: 'ذو القعدة',
            12: 'ذو الحجة'
        };
        const COPTIC_MONTHS = [
            'توت', 'بابه', 'هاتور', 'كيهك', 'طوبة', 'أمشير',
            'برمهات', 'برمودة', 'بشنس', 'بؤونة', 'أبيب', 'مسرى', 'النسيء'
        ];

        // حساب التاريخ القبطي بدقة فلكية لأي تاريخ ميلادي
        function calculateCopticDate(dateObj) {
            const year = dateObj.getFullYear();
            const month = dateObj.getMonth() + 1;
            const day = dateObj.getDate();

            // حساب رقم اليوم اليولياني (Julian Day Number)
            const a = Math.floor((14 - month) / 12);
            const y = year + 4800 - a;
            const m = month + 12 * a - 3;
            const jdn = day + Math.floor((153 * m + 2) / 5) + 365 * y +
                        Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;

            // تحويل الرقم اليولياني إلى التقويم القبطي (عصر الشهداء يبدأ في JDN 1825030)
            const copticEpoch = 1825030;
            const daysSinceEpoch = jdn - copticEpoch;
            const copticYear = Math.floor((4 * daysSinceEpoch + 3) / 1461) + 1;
            const dayOfYear = daysSinceEpoch - Math.floor((1461 * (copticYear - 1)) / 4);
            const copticMonthIndex = Math.floor(dayOfYear / 30);
            const copticDay = (dayOfYear % 30) + 1;

            const monthName = COPTIC_MONTHS[copticMonthIndex] || COPTIC_MONTHS[0];
            return `${toArabicDigits(copticDay)} ${monthName} ${toArabicDigits(copticYear)} ق`;
        }

        // تنسيق الوقت من نظام 24 ساعة إلى 12 ساعة مع ص / م بالأرقام الهندية
        function formatPrayerTime12h(time24Str) {
            if (!time24Str) return { time: '٠٠:٠٠', period: 'ص' };
            // إزالة أي لاحقة زمنية مثل (EET)
            const cleanTime = time24Str.split(' ')[0];
            const [hourStr, minuteStr] = cleanTime.split(':');
            let hour = parseInt(hourStr, 10);
            const minute = minuteStr.padStart(2, '0');
            const period = hour >= 12 ? 'م' : 'ص';

            hour = hour % 12;
            if (hour === 0) hour = 12;
            const formattedHour = String(hour).padStart(2, '0');

            return {
                time: toArabicDigits(`${formattedHour}:${minute}`),
                period: period
            };
        }

        // تحديث التواريخ المحلية فوراً (الميلادي + القبطي + اسم اليوم + احتياطي الهجري)
        function updateLocalDates(targetDate) {
            const dayName = ARABIC_DAYS[targetDate.getDay()];
            const gDay = targetDate.getDate();
            const gMonth = GREGORIAN_MONTHS[targetDate.getMonth()];
            const gYear = targetDate.getFullYear();

            document.getElementById('dayNameDisplay').textContent = dayName;
            document.getElementById('gregorianDayDisplay').textContent = toArabicDigits(gDay);
            document.getElementById('gregorianMonthDisplay').textContent = gMonth;
            document.getElementById('gregorianYearDisplay').textContent = `${toArabicDigits(gYear)} م`;
            document.getElementById('copticDateDisplay').textContent = calculateCopticDate(targetDate);

            // حساب هجري فوري عبر Intl كقيمة مبدئية ريثما يكتمل الاتصال بالـ API
            try {
                const hijriParts = new Intl.DateTimeFormat('en-TN-u-ca-islamic-umalqura', {
                    day: 'numeric',
                    month: 'numeric',
                    year: 'numeric'
                }).formatToParts(targetDate);

                const hDay = hijriParts.find(p => p.type === 'day')?.value;
                const hMonthNum = parseInt(hijriParts.find(p => p.type === 'month')?.value, 10);
                const hYear = hijriParts.find(p => p.type === 'year')?.value;

                if (hDay && hMonthNum && hYear) {
                    document.getElementById('hijriDayDisplay').textContent = toArabicDigits(hDay);
                    document.getElementById('hijriMonthDisplay').textContent = HIJRI_MONTHS[hMonthNum] || '';
                    document.getElementById('hijriYearDisplay').textContent = `${toArabicDigits(hYear)} هـ`;
                }
            } catch (e) {
                console.warn('Intl Hijri fallback skipped:', e);
            }
        }

        // جلب مواقيت الصلاة الحية والتاريخ الهجري المعتمد لمدينة القاهرة من Aladhan API
        async function fetchCairoLiveData(targetDate = new Date()) {
            const statusDot = document.getElementById('liveStatusDot');
            const statusText = document.getElementById('liveStatusText');

            updateLocalDates(targetDate);

            const citySelector = document.getElementById('mobileCitySelector');
            const selectedCity = citySelector ? citySelector.value : 'Cairo';
            const selectedCityLabel = citySelector
                ? citySelector.options[citySelector.selectedIndex].text
                : 'القاهرة';
            const toolbarCityTitle = document.getElementById('toolbarCityTitle');
            if (toolbarCityTitle) {
                toolbarCityTitle.textContent = `ورقة نتيجة يومية ومواقيت الصلاة — ${selectedCityLabel}`;
            }
            const prayerCityHeading = document.getElementById('prayerCityHeading');
            if (prayerCityHeading) {
                prayerCityHeading.textContent = `مواقيت الصلاة — ${selectedCityLabel}`;
            }

            statusDot.style.backgroundColor = '#E8CF88';
            statusText.textContent = `جاري جلب مواقيت ${selectedCityLabel}...`;

            const dd = String(targetDate.getDate()).padStart(2, '0');
            const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
            const yyyy = targetDate.getFullYear();
            const dateParam = `${dd}-${mm}-${yyyy}`;

            try {
                // method=5 corresponds to Egyptian General Authority of Survey (الهيئة المصرية العامة للمساحة)
                const apiUrl = `https://api.aladhan.com/v1/timingsByCity/${dateParam}?city=${encodeURIComponent(selectedCity)}&country=Egypt&method=5`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('فشل الاتصال بخادم المواقيت');

                const json = await response.json();
                if (json.code === 200 && json.data) {
                    const timings = json.data.timings;
                    const hijri = json.data.date.hijri;

                    // تحديث مواقيت الصلاة الستة
                    const prayersMap = [
                        { key: 'Fajr', timeId: 'fajrTime', periodId: 'fajrPeriod' },
                        { key: 'Sunrise', timeId: 'sunriseTime', periodId: 'sunrisePeriod' },
                        { key: 'Dhuhr', timeId: 'dhuhrTime', periodId: 'dhuhrPeriod' },
                        { key: 'Asr', timeId: 'asrTime', periodId: 'asrPeriod' },
                        { key: 'Maghrib', timeId: 'maghribTime', periodId: 'maghribPeriod' },
                        { key: 'Isha', timeId: 'ishaTime', periodId: 'ishaPeriod' }
                    ];

                    prayersMap.forEach(item => {
                        const formatted = formatPrayerTime12h(timings[item.key]);
                        document.getElementById(item.timeId).textContent = formatted.time;
                        document.getElementById(item.periodId).textContent = formatted.period;
                    });

                    // تحديث التاريخ الهجري الدقيق من الاستجابة
                    if (hijri) {
                        const hDayClean = parseInt(hijri.day, 10);
                        const hMonthAr = HIJRI_MONTHS[hijri.month.number] || hijri.month.ar;
                        document.getElementById('hijriDayDisplay').textContent = toArabicDigits(hDayClean);
                        document.getElementById('hijriMonthDisplay').textContent = hMonthAr;
                        document.getElementById('hijriYearDisplay').textContent = `${toArabicDigits(hijri.year)} هـ`;
                    }

                    statusDot.style.backgroundColor = '#34D399';
                    statusText.textContent = `محدث مباشرة • توقيت ${selectedCityLabel}`;
                }
            } catch (error) {
                console.error('Error fetching live prayer times:', error);
                statusDot.style.backgroundColor = '#F59E0B';
                statusText.textContent = `تعذر تحديث مواقيت ${selectedCityLabel}`;
            }
        }

        // الحصول على التوقيت الحالي في مدينة القاهرة
        function getCairoNow() {
            try {
                const cairoStr = new Date().toLocaleString('en-US', { timeZone: 'Africa/Cairo' });
                return new Date(cairoStr);
            } catch (e) {
                return new Date();
            }
        }

        // إعادة الضبط إلى تاريخ اليوم في القاهرة
        function resetToToday() {
            const cairoToday = getCairoNow();
            const todayValue = getCairoTodayValue();

            // مزامنة التاريخ في شريط الكمبيوتر وقائمة الموبايل.
            document.getElementById('dateSelector').value = todayValue;
            const mobileDateInput = document.getElementById('mobileDateSelector');
            if (mobileDateInput) mobileDateInput.value = todayValue;

            fetchCairoLiveData(cairoToday);
        }

        function isSamsungSmartTV() {
            const ua = navigator.userAgent || '';
            return /SMART-TV|SMARTTV|Tizen|SamsungBrowser|Maple/i.test(ua) ||
                   (window.location.search && window.location.search.indexOf('tv=1') !== -1);
        }

        function scaleCalendarSheet() {
            const wrapper = document.getElementById('sheetWrapper');
            const sheet = document.getElementById('calendarSheet');
            const toolbar = document.querySelector('.toolbar');
            if (!wrapper || !sheet) return;

            const isMobileLayout = window.innerWidth <= 700;
            if (isMobileLayout) {
                document.body.classList.remove('smart-tv-mode');
                wrapper.style.height = '';
                wrapper.style.width = '';
                sheet.style.transform = 'none';
                return;
            }

            const tvMode = isSamsungSmartTV() && window.innerWidth > 700;
            document.body.classList.toggle('smart-tv-mode', tvMode);

            if (tvMode) {
                /* حساب الحجم يدوياً لتفادي اعتماد المتصفح القديم على aspect-ratio */
                const sidePadding = 48;
                const verticalPadding = 150;
                const availableWidth = Math.max(320, window.innerWidth - sidePadding);
                const availableHeight = Math.max(240, window.innerHeight - verticalPadding);
                const scale = Math.min(availableWidth / 1536, availableHeight / 1024);
                const renderedWidth = Math.floor(1536 * scale);
                const renderedHeight = Math.floor(1024 * scale);

                wrapper.style.width = renderedWidth + 'px';
                wrapper.style.height = renderedHeight + 'px';
                wrapper.style.maxWidth = 'none';
                sheet.style.transform = 'scale(' + scale + ')';

                if (toolbar) {
                    toolbar.style.width = renderedWidth + 'px';
                    toolbar.style.maxWidth = 'none';
                }
            } else {
                /* fallback عام: بعض متصفحات التلفزيون لا تدعم CSS aspect-ratio */
                wrapper.style.height = Math.round(wrapper.clientWidth * 2 / 3) + 'px';
                const scale = wrapper.clientWidth / 1536;
                sheet.style.transform = 'scale(' + scale + ')';
                if (toolbar) {
                    toolbar.style.width = '';
                    toolbar.style.maxWidth = '';
                }
            }
        }

        window.addEventListener('load', () => {
            scaleCalendarSheet();
            resetToToday();

            // الاستماع لتغيير التاريخ من المستخدم
            const dateInput = document.getElementById('dateSelector');
            dateInput.addEventListener('change', (e) => {
                if (e.target.value) {
                    const [y, m, d] = e.target.value.split('-').map(Number);
                    const selectedDate = new Date(y, m - 1, d);
                    fetchCairoLiveData(selectedDate);
                }
            });

            // اختيار المدينة من قائمة الموبايل مع الاحتفاظ بالتاريخ المحدد.
            const mobileCitySelector = document.getElementById('mobileCitySelector');
            const mobileCitySearch = document.getElementById('mobileCitySearch');
            const governoratePickerButton = document.getElementById('governoratePickerButton');
            const governorateDropdown = document.getElementById('governorateDropdown');
            const governorateOptions = document.getElementById('governorateOptions');
            const governorateSelectedLabel = document.getElementById('governorateSelectedLabel');

            if (mobileCitySelector && mobileCitySearch && governoratePickerButton &&
                governorateDropdown && governorateOptions) {
                const governorates = Array.from(mobileCitySelector.options).map(option => ({
                    value: option.value,
                    text: option.textContent.trim()
                }));

                function renderGovernorates(query = '') {
                    const q = query.trim().toLocaleLowerCase('ar');
                    const matches = governorates.filter(item =>
                        item.text.toLocaleLowerCase('ar').includes(q)
                    );
                    governorateOptions.replaceChildren();

                    if (!matches.length) {
                        const empty = document.createElement('div');
                        empty.className = 'governorate-empty';
                        empty.textContent = 'لا توجد محافظة بهذا الاسم';
                        governorateOptions.appendChild(empty);
                        return;
                    }

                    matches.forEach(item => {
                        const optionButton = document.createElement('button');
                        optionButton.type = 'button';
                        optionButton.className = 'governorate-option';
                        optionButton.textContent = item.text;
                        optionButton.setAttribute('aria-selected',
                            String(item.value === mobileCitySelector.value));
                        optionButton.addEventListener('click', () => {
                            mobileCitySelector.value = item.value;
                            governorateSelectedLabel.textContent = item.text;
                            governorateDropdown.hidden = true;
                            governoratePickerButton.setAttribute('aria-expanded', 'false');
                            mobileCitySelector.dispatchEvent(new Event('change', { bubbles: true }));
                        });
                        governorateOptions.appendChild(optionButton);
                    });
                }

                renderGovernorates();

                // القائمة العلوية للكمبيوتر تستخدم نفس المحافظات ونفس محدّث المواقيت.
                const desktopPicker = document.getElementById('desktopGovernoratePicker');
                const desktopButton = document.getElementById('desktopGovernorateButton');
                const desktopDropdown = document.getElementById('desktopGovernorateDropdown');
                const desktopSearch = document.getElementById('desktopGovernorateSearch');
                const desktopOptions = document.getElementById('desktopGovernorateOptions');
                const desktopLabel = document.getElementById('desktopGovernorateLabel');

                function renderDesktopGovernorates(query = '') {
                    if (!desktopOptions) return;
                    const q = query.trim().toLocaleLowerCase('ar');
                    const matches = governorates.filter(item =>
                        item.text.toLocaleLowerCase('ar').includes(q)
                    );
                    desktopOptions.replaceChildren();

                    if (!matches.length) {
                        const empty = document.createElement('div');
                        empty.className = 'desktop-governorate-empty';
                        empty.textContent = 'لا توجد محافظة بهذا الاسم';
                        desktopOptions.appendChild(empty);
                        return;
                    }

                    matches.forEach(item => {
                        const optionButton = document.createElement('button');
                        optionButton.type = 'button';
                        optionButton.className = 'desktop-governorate-option';
                        optionButton.textContent = item.text;
                        optionButton.setAttribute('aria-selected',
                            String(item.value === mobileCitySelector.value));
                        optionButton.addEventListener('click', () => {
                            mobileCitySelector.value = item.value;
                            if (desktopLabel) desktopLabel.textContent = item.text;
                            if (governorateSelectedLabel) governorateSelectedLabel.textContent = item.text;
                            desktopDropdown.hidden = true;
                            desktopButton.setAttribute('aria-expanded', 'false');
                            mobileCitySelector.dispatchEvent(new Event('change', { bubbles: true }));
                        });
                        desktopOptions.appendChild(optionButton);
                    });
                }

                if (desktopButton && desktopDropdown && desktopSearch) {
                    renderDesktopGovernorates();
                    desktopButton.addEventListener('click', () => {
                        const opening = desktopDropdown.hidden;
                        desktopDropdown.hidden = !opening;
                        desktopButton.setAttribute('aria-expanded', String(opening));
                        if (opening) {
                            desktopSearch.value = '';
                            renderDesktopGovernorates();
                            desktopSearch.focus();
                        }
                    });
                    desktopSearch.addEventListener('input', () => {
                        renderDesktopGovernorates(desktopSearch.value);
                    });
                    document.addEventListener('click', event => {
                        if (desktopPicker && !desktopPicker.contains(event.target) && !desktopDropdown.hidden) {
                            desktopDropdown.hidden = true;
                            desktopButton.setAttribute('aria-expanded', 'false');
                        }
                    });
                }

                governoratePickerButton.addEventListener('click', () => {
                    const opening = governorateDropdown.hidden;
                    governorateDropdown.hidden = !opening;
                    governoratePickerButton.setAttribute('aria-expanded', String(opening));
                    if (opening) {
                        mobileCitySearch.value = '';
                        renderGovernorates();
                        mobileCitySearch.focus();
                    }
                });

                mobileCitySearch.addEventListener('input', () => {
                    renderGovernorates(mobileCitySearch.value);
                });

                document.addEventListener('click', event => {
                    const picker = document.getElementById('governoratePicker');
                    if (picker && !picker.contains(event.target) && !governorateDropdown.hidden) {
                        governorateDropdown.hidden = true;
                        governoratePickerButton.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            if (mobileCitySelector) {
                mobileCitySelector.addEventListener('change', () => {
                    const chosenOption = mobileCitySelector.options[mobileCitySelector.selectedIndex];
                    if (governorateSelectedLabel && chosenOption) {
                        governorateSelectedLabel.textContent = chosenOption.textContent.trim();
                    }
                    const desktopGovernorateLabel = document.getElementById('desktopGovernorateLabel');
                    if (desktopGovernorateLabel && chosenOption) {
                        desktopGovernorateLabel.textContent = chosenOption.textContent.trim();
                    }
                    const currentDateValue = document.getElementById('dateSelector').value;
                    let selectedDate = getCairoNow();
                    if (currentDateValue) {
                        const [y, m, d] = currentDateValue.split('-').map(Number);
                        selectedDate = new Date(y, m - 1, d);
                    }

                    // حدّث المواقيت للمحافظة المختارة ثم أغلق القائمة مباشرة لعرض النتيجة.
                    fetchCairoLiveData(selectedDate);
                    toggleSettings(false);
                });
            }

            // منتقي التاريخ داخل قائمة الموبايل: نفس سلوك اختيار تاريخ الكمبيوتر
            const mobileDateInput = document.getElementById('mobileDateSelector');
            if (mobileDateInput) {
                mobileDateInput.addEventListener('change', (e) => {
                    if (e.target.value) {
                        const [y, m, d] = e.target.value.split('-').map(Number);
                        const selectedDate = new Date(y, m - 1, d);
                        dateInput.value = e.target.value;
                        mobileDateInput.value = e.target.value;
                        fetchCairoLiveData(selectedDate);
                        toggleSettings(false);
                    }
                });
            }
        });

        window.addEventListener('resize', scaleCalendarSheet);
        window.addEventListener('orientationchange', scaleCalendarSheet);
        window.addEventListener('beforeprint', () => {
            const sheet = document.getElementById('calendarSheet');
            const wrapper = document.getElementById('sheetWrapper');
            if (sheet && wrapper) {
                const scale = wrapper.clientWidth / 1536;
                sheet.style.transform = `scale(${scale})`;
            }
        });
        window.addEventListener('afterprint', scaleCalendarSheet);
    </script>
</body>
</html>
