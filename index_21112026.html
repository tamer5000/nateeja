<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة نتيجة يومية ومواقيت الصلاة - القاهرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-dark: #0A1B36;
            --navy-main: #0F2342;
            --navy-light: #1B365D;
            --gold-dark: #A67C2E;
            --gold-main: #C9A24B;
            --gold-light: #E8CF88;
            --gold-pale: #F6E6B4;
            --ivory-bg: #FAF7F0;
            --cream-card: #F5EFE2;
            --cream-deep: #EAE0CC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            background-color: #1E242B;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 14px;
            overflow-x: hidden;
        }

        /* شريط الأدوات بتصميم CSS خالص دون الاعتماد على مكتبات خارجية */
        .toolbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            padding: 10px 18px;
            background: rgba(15, 35, 66, 0.95);
            border: 1px solid #C9A24B;
            border-radius: 12px;
            color: #FAF7F0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .toolbar-info,
        .toolbar-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .live-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: #C9A24B;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-weight: 800;
            font-size: 15px;
            color: #FAF7F0;
        }

        .live-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 999px;
            background: #1B365D;
            color: #E8CF88;
            border: 1px solid rgba(201, 162, 75, 0.45);
        }

        .btn-gold {
            background: linear-gradient(135deg, #C9A24B, #A67C2E);
            color: #0A1B36;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            padding: 7px 18px;
            border-radius: 8px;
            border: 1px solid #E8CF88;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
        }

        .btn-outline-gold {
            background: transparent;
            color: #E8CF88;
            border: 1px solid #C9A24B;
            padding: 7px 14px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .date-picker-input {
            background: rgba(250, 247, 240, 0.12);
            border: 1px solid #C9A24B;
            color: #FAF7F0;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            min-height: 38px;
        }

        .desktop-governorate-picker { position: relative; min-width: 150px; }
        .desktop-governorate-button {
            width: 100%; min-height: 38px; display: flex;
            align-items: center; justify-content: space-between;
            gap: 12px; cursor: pointer; text-align: right;
            background: rgba(250,247,240,0.12); color: #FAF7F0;
            border: 1px solid #C9A24B; border-radius: 8px;
            padding: 6px 12px; font-family: 'Cairo', sans-serif; font-size: 14px;
        }
        .desktop-governorate-dropdown {
            position: absolute; top: calc(100% + 6px); right: 0;
            width: 230px; max-width: calc(100vw - 36px); z-index: 1000; padding: 8px;
            border: 1px solid #C9A24B; border-radius: 10px;
            background: #0A1B36; box-shadow: 0 10px 24px rgba(0,0,0,0.45);
        }
        .desktop-governorate-dropdown[hidden] { display: none !important; }
        .desktop-governorate-search {
            box-sizing: border-box; width: 100%; min-height: 38px;
            margin-bottom: 7px; padding: 6px 10px; direction: rtl;
            text-align: right; color: #FAF7F0;
            background: rgba(250,247,240,0.10);
            border: 1px solid #C9A24B; border-radius: 7px;
            font-family: 'Cairo', sans-serif;
        }
        .desktop-governorate-options { max-height: 250px; overflow-y: auto; }
        .desktop-governorate-option {
            display: block; width: 100%; padding: 8px 10px;
            border: 0; border-bottom: 1px solid rgba(201,162,75,0.2);
            background: transparent; color: #FAF7F0; text-align: right;
            font-family: 'Cairo', sans-serif; font-size: 14px; cursor: pointer;
        }
        .desktop-governorate-option:hover,
        .desktop-governorate-option[aria-selected="true"] {
            background: rgba(201,162,75,0.22); color: #E8CF88;
        }
        .desktop-governorate-empty { padding: 10px; color: #FAF7F0; text-align: center; font-size: 14px; }

        /* الحاوية الرئيسية مع ارتفاع افتراضي آمن قبل التحجيم */
        .sheet-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 640px;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            border-radius: 6px;
            overflow: hidden;
            background-color: #FAF7F0;
            margin: 0 auto;
        }

        /* لوحة التصميم الأساسية بأبعاد ثابتة 1536x1024 */
        .calendar-sheet {
            width: 1536px;
            height: 1024px;
            position: absolute;
            top: 0;
            left: 0;
            -webkit-transform-origin: top left;
            transform-origin: top left;
            background-color: #FAF7F0;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* خلفية النقوش الهندسية الإسلامية الدقيقة */
        .islamic-pattern-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.055;
            pointer-events: none;
            z-index: 1;
        }

        /* تدرج إضاءة ناعم */
        .ambient-lighting {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.65) 0%, rgba(235, 224, 200, 0.35) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* الإطار الخارجي المزدوج */
        .outer-frame-navy {
            position: absolute;
            top: 22px; left: 22px; right: 22px; bottom: 22px;
            border: 3px solid #0F2342;
            border-radius: 14px;
            pointer-events: none;
            z-index: 10;
        }

        .outer-frame-gold {
            position: absolute;
            top: 29px; left: 29px; right: 29px; bottom: 29px;
            border: 2px solid #C9A24B;
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }

        /* زخارف الأركان الأربعة */
        .corner-ornament {
            position: absolute;
            width: 115px;
            height: 115px;
            z-index: 12;
            pointer-events: none;
        }
        .corner-tr { top: 20px; right: 20px; }
        .corner-tl { top: 20px; left: 20px; -webkit-transform: scaleX(-1); transform: scaleX(-1); }
        .corner-br { bottom: 20px; right: 20px; -webkit-transform: scaleY(-1); transform: scaleY(-1); }
        .corner-bl { bottom: 20px; left: 20px; -webkit-transform: scale(-1, -1); transform: scale(-1, -1); }

        /* 1. اللوحة الرئيسية - اليوم */
        .friday-section {
            position: absolute;
            left: 31.5%;
            width: 37%;
            top: 3.2%;
            height: 34.5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 15;
        }

        .friday-plaque-container {
            position: relative;
            width: 100%;
            height: 245px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 14px 24px rgba(10, 27, 54, 0.28));
        }

        .friday-title {
            position: relative;
            z-index: 5;
            font-family: 'Amiri', serif;
            font-size: 138px;
            font-weight: 700;
            color: #FCF9F2;
            line-height: 1;
            margin-top: -12px;
            text-shadow:
                0 3px 0 #A67C2E,
                0 6px 18px rgba(201, 162, 75, 0.65),
                0 10px 25px rgba(0, 0, 0, 0.45);
            letter-spacing: 1px;
        }

        /* 2. صناديق التاريخ الهجري والميلادي */
        .date-card {
            position: absolute;
            top: 7.2%;
            height: 49.5%;
            width: 26.5%;
            background: linear-gradient(180deg, #FDFBF7 0%, #F3EBDC 100%);
            border-radius: 24px;
            border: 3px solid #C9A24B;
            box-shadow:
                0 14px 30px rgba(15, 35, 66, 0.14),
                inset 0 0 0 4px #FAF6EE,
                inset 0 0 0 6px #A67C2E;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 15;
        }

        .hijri-card { left: 4.5%; }
        .gregorian-card { right: 4.5%; }

        .date-card-header {
            height: 86px;
            margin: 6px 6px 0 6px;
            border-radius: 16px 16px 4px 4px;
            background: linear-gradient(135deg, #0A1B36 0%, #1B365D 50%, #0A1B36 100%);
            border-bottom: 3px solid #C9A24B;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .date-card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px 22px 20px;
            text-align: center;
        }

        .date-day-number {
            font-family: 'Cairo', sans-serif;
            font-size: 168px;
            font-weight: 900;
            color: #0F2342;
            line-height: 0.92;
            margin-top: 6px;
            text-shadow: 0 4px 10px rgba(15, 35, 66, 0.12);
        }

        .date-month-name {
            font-family: 'Cairo', sans-serif;
            font-size: 46px;
            font-weight: 800;
            color: #0A1B36;
            line-height: 1.15;
        }

        .gold-divider-line {
            width: 78%;
            height: 2.5px;
            background: linear-gradient(90deg, transparent 0%, #A67C2E 20%, #C9A24B 50%, #A67C2E 80%, transparent 100%);
            border-radius: 2px;
        }

        .date-year-text {
            font-family: 'Cairo', sans-serif;
            font-size: 48px;
            font-weight: 800;
            color: #0F2342;
            line-height: 1.1;
        }

        /* 3. التاريخ القبطي */
        .coptic-section {
            position: absolute;
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            top: 40.5%;
            width: 34%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 15;
        }

        .coptic-text {
            font-family: 'Cairo', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: #0F2342;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* 4. جدول مواقيت الصلاة */
        .prayer-table-container {
            position: absolute;
            left: 3.8%;
            right: 3.8%;
            top: 61.5%;
            height: 28.2%;
            border-radius: 22px;
            border: 3px solid #C9A24B;
            box-shadow:
                0 16px 35px rgba(15, 35, 66, 0.16),
                inset 0 0 0 3px #FAF6EE;
            background: linear-gradient(180deg, #FBF8F1 0%, #EFE5D1 100%);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            overflow: hidden;
            z-index: 15;
        }

        .prayer-col {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .prayer-col:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 8px;
            bottom: 8px;
            left: 0;
            width: 2px;
            background: linear-gradient(180deg, #E8CF88 0%, #C9A24B 50%, #A67C2E 100%);
            z-index: 5;
        }

        .prayer-header {
            height: 43%;
            background: linear-gradient(180deg, #0A1B36 0%, #1B365D 100%);
            border-bottom: 3px solid #C9A24B;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px;
        }

        .prayer-icon {
            width: 44px;
            height: 44px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
        }

        .prayer-name {
            font-family: 'Cairo', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.1;
        }

        .prayer-time-cell {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 4px;
        }

        .prayer-time-value {
            font-family: 'Cairo', sans-serif;
            font-size: 54px;
            font-weight: 900;
            color: #0F2342;
            line-height: 1.05;
            letter-spacing: 0.5px;
        }

        .prayer-period {
            font-family: 'Cairo', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #1B365D;
            margin-top: 2px;
            line-height: 1;
        }

        /* 5. الزخرفة الذهبية السفلية في المنتصف */
        .bottom-center-ornament {
            position: absolute;
            bottom: 40px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            width: 480px;
            height: 32px;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تنسيق مخصص للشاشات العريضة بنسبة 16:9 (1920x1080) */
        body.widescreen-16-9 .calendar-sheet {
            width: 1920px;
            height: 1080px;
        }

        body.widescreen-16-9 .islamic-pattern-bg {
            width: 1920px;
            height: 1080px;
        }

        body.widescreen-16-9 .friday-section {
            left: 33%;
            width: 34%;
            top: 3%;
            height: 35%;
        }

        body.widescreen-16-9 .friday-plaque-container {
            height: 255px;
        }

        body.widescreen-16-9 .friday-title {
            font-size: 144px;
        }

        body.widescreen-16-9 .hijri-card {
            left: 5%;
            width: 24.5%;
            top: 6.5%;
            height: 50.5%;
        }

        body.widescreen-16-9 .gregorian-card {
            right: 5%;
            width: 24.5%;
            top: 6.5%;
            height: 50.5%;
        }

        body.widescreen-16-9 .date-day-number {
            font-size: 176px;
        }

        body.widescreen-16-9 .date-month-name {
            font-size: 50px;
        }

        body.widescreen-16-9 .date-year-text {
            font-size: 52px;
        }

        body.widescreen-16-9 .coptic-section {
            top: 40.5%;
            width: 32%;
        }

        body.widescreen-16-9 .coptic-text {
            font-size: 42px;
        }

        body.widescreen-16-9 .prayer-table-container {
            left: 5%;
            right: 5%;
            top: 61%;
            height: 29%;
        }

        body.widescreen-16-9 .prayer-name {
            font-size: 36px;
        }

        body.widescreen-16-9 .prayer-time-value {
            font-size: 60px;
        }

        body.widescreen-16-9 .prayer-period {
            font-size: 30px;
        }

        body.widescreen-16-9 .bottom-center-ornament {
            bottom: 34px;
            width: 560px;
        }

        /* زر القائمة ولوحة الضبط داخل الورقة للموبايل */
        .sheet-menu-toggle {
            position: absolute;
            top: 145px;
            right: 42px;
            z-index: 40;
            width: 48px;
            height: 48px;
            display: none !important;
            align-items: center;
            justify-content: center;
            color: #E8CF88;
            background: linear-gradient(145deg, #1B365D, #0A1B36);
            border: 2px solid #C9A24B;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(10, 27, 54, 0.2);
            cursor: pointer;
        }

        .sheet-settings-panel[hidden] { display: none !important; }
        .sheet-settings-panel {
            position: absolute;
            top: 201px;
            right: 42px;
            z-index: 45;
            width: 280px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #FAF7F0;
            background: linear-gradient(160deg, #1B365D, #0A1B36);
            border: 2px solid #C9A24B;
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .sheet-settings-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #E8CF88;
            font-weight: 800;
            font-size: 17px;
        }

        .sheet-settings-close {
            border: 0;
            background: transparent;
            color: #E8CF88;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }

        .sheet-settings-label {
            color: #FAF7F0;
            font-size: 13px;
            font-weight: 700;
        }

        .sheet-settings-panel .date-picker-input {
            width: 100%;
            min-height: 42px;
        }

        .governorate-picker { position: relative; width: 100%; }
        .governorate-picker-button {
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; text-align: right; font: inherit; width: 100%;
        }
        .governorate-dropdown {
            position: absolute; top: calc(100% + 5px); right: 0; left: 0;
            z-index: 100; padding: 8px; border: 1px solid #C9A24B;
            border-radius: 10px; background: #0A1B36;
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
        }
        .governorate-dropdown[hidden] { display: none !important; }
        .governorate-search { box-sizing: border-box; margin-bottom: 7px; width: 100%; }
        .governorate-options { max-height: 190px; overflow-y: auto; }
        .governorate-option {
            display: block; width: 100%; padding: 8px 10px; border: 0;
            border-bottom: 1px solid rgba(201,162,75,0.22);
            background: transparent; color: #FAF7F0; text-align: right;
            font: inherit; cursor: pointer;
        }
        .governorate-option:hover,
        .governorate-option[aria-selected="true"] {
            background: rgba(201,162,75,0.18); color: #E8CF88;
        }
        .governorate-empty { padding: 10px; color: #FAF7F0; text-align: center; }
        .prayer-city-heading { display: none; }

        .sheet-settings-actions {
            display: flex;
            gap: 8px;
        }
        .sheet-settings-actions > button {
            flex: 1;
            justify-content: center;
        }

        /* تكبير أزرار وقوائم التحكم على الشاشات الكبيرة جداً */
        @media screen and (min-width: 1600px) {
            .toolbar {
                min-height: 64px;
                padding: 12px 24px;
            }
            .toolbar-title { font-size: 18px; }
            .live-badge { font-size: 14px; }
            .toolbar button,
            .toolbar input,
            .desktop-governorate-button {
                min-height: 46px;
                font-size: 17px;
            }
            .desktop-governorate-dropdown { width: 290px; }
            .desktop-governorate-search,
            .desktop-governorate-option {
                min-height: 44px;
                font-size: 17px;
            }
        }

        /* تخطيط الهواتف فقط (640px فأقل حتى يظهر الآيباد بالتصميم الكامل) */
        @media screen and (max-width: 640px) {
            body {
                justify-content: flex-start;
                padding: 10px;
            }
            .toolbar { display: none !important; }
            .sheet-menu-toggle {
                display: flex !important;
                top: 70px;
                right: 16px;
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }
            .sheet-settings-panel {
                top: 118px;
                right: 16px;
                width: calc(100% - 32px);
                max-width: 280px;
                padding: 12px;
            }
            .sheet-wrapper {
                width: 100%;
                max-width: 520px;
                height: auto !important;
                overflow: visible;
                border-radius: 8px;
            }
            .calendar-sheet {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                width: 100% !important;
                height: auto !important;
                -webkit-transform: none !important;
                transform: none !important;
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-areas:
                    "friday friday"
                    "hijri gregorian"
                    "coptic coptic"
                    "cityheading cityheading"
                    "prayers prayers";
                gap: 12px;
                padding: 28px 16px 54px;
                overflow: hidden;
                border-radius: 8px;
            }
            .outer-frame-navy { top: 7px; left: 7px; right: 7px; bottom: 7px; border-width: 2px; border-radius: 10px; }
            .outer-frame-gold { top: 12px; left: 12px; right: 12px; bottom: 12px; border-width: 1px; border-radius: 7px; }
            .corner-ornament { width: 54px; height: 54px; }
            .corner-tr { top: 6px; right: 6px; }
            .corner-tl { top: 6px; left: 6px; }
            .corner-br { bottom: 6px; right: 6px; }
            .corner-bl { bottom: 6px; left: 6px; }
            .friday-section {
                grid-area: friday;
                position: relative; left: auto; top: auto; width: 100%; height: auto;
                padding: 2px 18px 0;
            }
            .friday-section > svg:first-child,
            .friday-section > svg:last-child { width: 52%; max-width: 180px; height: auto; }
            .friday-plaque-container { width: 100%; max-width: 360px; height: 120px; }
            .friday-title { font-size: 64px; margin-top: -5px; }
            .date-card {
                position: relative; top: auto; left: auto; right: auto; width: auto;
                height: 190px; border-radius: 14px; border-width: 2px;
            }
            .hijri-card { grid-area: hijri; }
            .gregorian-card { grid-area: gregorian; }
            .date-card-header { height: 42px; margin: 4px 4px 0; border-radius: 9px 9px 3px 3px; border-bottom-width: 2px; }
            .date-card-header svg { width: 28px; height: 28px; }
            .date-card-body { padding: 7px 5px 10px; justify-content: space-evenly; }
            .date-day-number { font-size: 62px; line-height: 0.95; margin-top: 0; }
            .date-month-name { font-size: 18px; line-height: 1.2; }
            .date-year-text { font-size: 19px; line-height: 1.1; }
            .coptic-section {
                grid-area: coptic; position: relative; left: auto; top: auto;
                -webkit-transform: none; transform: none; width: 100%; padding: 2px 4px;
            }
            .coptic-text { font-size: 20px; line-height: 1.35; margin-bottom: 3px; text-align: center; }
            .coptic-section svg { width: 75%; max-width: 260px; height: auto; }
            .prayer-city-heading {
                display: block; grid-area: cityheading; text-align: center;
                color: #0F2342; font-size: 20px; font-weight: 800; margin: 0 0 -4px;
            }
            .prayer-table-container {
                grid-area: prayers; position: relative; left: auto; right: auto; top: auto;
                width: 100%; height: auto; grid-template-columns: repeat(3, minmax(0, 1fr));
                border-radius: 14px; border-width: 2px;
            }
            .prayer-col { min-width: 0; min-height: 118px; border-bottom: 1px solid rgba(166, 124, 46, 0.45); }
            .prayer-col:nth-child(3n + 1),
            .prayer-col:nth-child(3n + 2) { border-left: 1px solid rgba(166, 124, 46, 0.45); }
            .prayer-col:not(:last-child)::after { display: none; }
            .prayer-header { height: 58px; min-height: 58px; gap: 2px; padding: 4px 2px; border-bottom-width: 2px; }
            .prayer-icon { width: 25px; height: 25px; }
            .prayer-name { font-size: 16px; line-height: 1.1; }
            .prayer-time-cell { min-height: 58px; padding: 5px 2px; }
            .prayer-time-value { font-size: 24px; line-height: 1.1; letter-spacing: 0; }
            .prayer-period { font-size: 15px; margin-top: 2px; }
            .bottom-center-ornament { width: 68%; max-width: 280px; height: 22px; bottom: 17px; }
            .bottom-center-ornament svg { width: 100%; height: 100%; }
        }

        /* إعدادات الطباعة */
        @media print {

            .sheet-wrapper { max-width: 100%; width: 100vw; height: 100vh; box-shadow: none; border-radius: 0; }
            .calendar-sheet { display: block; width: 1536px; height: 1024px; padding: 0; border-radius: 0; }
        }

    <!-- سكريبت متوافق مع كافة المتصفحات القديمة والحديثة ويدعم 16:9 و 3:2 -->
    <script>
        function padTwo(num) {
            var s = String(num);
            return s.length < 2 ? '0' + s : s;
        }

        function hasClassName(el, cls) {
            return (' ' + (el.className || '') + ' ').indexOf(' ' + cls + ' ') !== -1;
        }

        function addClassName(el, cls) {
            if (!el || hasClassName(el, cls)) return;
            el.className = ((el.className || '') + ' ' + cls).replace(/^\s+|\s+$/g, '');
        }

        function removeClassName(el, cls) {
            if (!el || !hasClassName(el, cls)) return;
            el.className = (' ' + (el.className || '') + ' ')
                .replace(' ' + cls + ' ', ' ')
                .replace(/^\s+|\s+$/g, '');
        }

        function toggleSettings(forceState) {
            var panel = document.getElementById('settingsPanel');
            var button = document.getElementById('settingsToggle');
            if (!panel || !button) return;
            var shouldOpen = typeof forceState === 'boolean' ? forceState : panel.hidden;

            if (shouldOpen) {
                var desktopDateInput = document.getElementById('dateSelector');
                var mobileDateInput = document.getElementById('mobileDateSelector');
                if (desktopDateInput && mobileDateInput) {
                    mobileDateInput.value = desktopDateInput.value || getCairoTodayValue();
                }
            }

            panel.hidden = !shouldOpen;
            button.setAttribute('aria-expanded', String(shouldOpen));
        }

        function getCairoTodayValue() {
            var cairoToday = getCairoNow();
            var yyyy = cairoToday.getFullYear();
            var mm = padTwo(cairoToday.getMonth() + 1);
            var dd = padTwo(cairoToday.getDate());
            return yyyy + '-' + mm + '-' + dd;
        }

        function toArabicDigits(value) {
            var arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(value).replace(/\d/g, function (d) {
                return arabicDigits[Number(d)];
            });
        }

        var ARABIC_DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        var GREGORIAN_MONTHS = [
            'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
            'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
        ];
        var HIJRI_MONTHS = {
            1: 'محرم',
            2: 'صفر',
            3: 'ربيع الأول',
            4: 'ربيع الآخر',
            5: 'جمادى الأولى',
            6: 'جمادى الآخرة',
            7: 'رجب',
            8: 'شعبان',
            9: 'رمضان',
            10: 'شوال',
            11: 'ذو القعدة',
            12: 'ذو الحجة'
        };
        var COPTIC_MONTHS = [
            'توت', 'بابه', 'هاتور', 'كيهك', 'طوبة', 'أمشير',
            'برمهات', 'برمودة', 'بشنس', 'بؤونة', 'أبيب', 'مسرى', 'النسيء'
        ];

        function calculateCopticDate(dateObj) {
            var year = dateObj.getFullYear();
            var month = dateObj.getMonth() + 1;
            var day = dateObj.getDate();

            var a = Math.floor((14 - month) / 12);
            var y = year + 4800 - a;
            var m = month + 12 * a - 3;
            var jdn = day + Math.floor((153 * m + 2) / 5) + 365 * y +
                      Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;

            var copticEpoch = 1825030;
            var daysSinceEpoch = jdn - copticEpoch;
            var copticYear = Math.floor((4 * daysSinceEpoch + 3) / 1461) + 1;
            var dayOfYear = daysSinceEpoch - Math.floor((1461 * (copticYear - 1)) / 4);
            var copticMonthIndex = Math.floor(dayOfYear / 30);
            var copticDay = (dayOfYear % 30) + 1;

            var monthName = COPTIC_MONTHS[copticMonthIndex] || COPTIC_MONTHS[0];
            return toArabicDigits(copticDay) + ' ' + monthName + ' ' + toArabicDigits(copticYear) + ' ق';
        }

        function formatPrayerTime12h(time24Str) {
            if (!time24Str) return { time: '٠٠:٠٠', period: 'ص' };
            var cleanTime = time24Str.split(' ')[0];
            var parts = cleanTime.split(':');
            var hour = parseInt(parts[0], 10);
            var minute = padTwo(parts[1]);
            var period = hour >= 12 ? 'م' : 'ص';

            hour = hour % 12;
            if (hour === 0) hour = 12;
            var formattedHour = padTwo(hour);

            return {
                time: toArabicDigits(formattedHour + ':' + minute),
                period: period
            };
        }

        function updateLocalDates(targetDate) {
            var dayName = ARABIC_DAYS[targetDate.getDay()];
            var gDay = targetDate.getDate();
            var gMonth = GREGORIAN_MONTHS[targetDate.getMonth()];
            var gYear = targetDate.getFullYear();

            document.getElementById('dayNameDisplay').textContent = dayName;
            document.getElementById('gregorianDayDisplay').textContent = toArabicDigits(gDay);
            document.getElementById('gregorianMonthDisplay').textContent = gMonth;
            document.getElementById('gregorianYearDisplay').textContent = toArabicDigits(gYear) + ' م';
            document.getElementById('copticDateDisplay').textContent = calculateCopticDate(targetDate);

            try {
                if (typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
                    var formatter = new Intl.DateTimeFormat('en-TN-u-ca-islamic-umalqura', {
                        day: 'numeric',
                        month: 'numeric',
                        year: 'numeric'
                    });
                    if (formatter.formatToParts) {
                        var hijriParts = formatter.formatToParts(targetDate);
                        var hDay = null, hMonthNum = 0, hYear = null;
                        for (var i = 0; i < hijriParts.length; i++) {
                            if (hijriParts[i].type === 'day') hDay = hijriParts[i].value;
                            if (hijriParts[i].type === 'month') hMonthNum = parseInt(hijriParts[i].value, 10);
                            if (hijriParts[i].type === 'year') hYear = hijriParts[i].value;
                        }
                        if (hDay && hMonthNum && hYear) {
                            document.getElementById('hijriDayDisplay').textContent = toArabicDigits(hDay);
                            document.getElementById('hijriMonthDisplay').textContent = HIJRI_MONTHS[hMonthNum] || '';
                            document.getElementById('hijriYearDisplay').textContent = toArabicDigits(hYear) + ' هـ';
                        }
                    }
                }
            } catch (e) {}
        }

        function fetchCairoLiveData(targetDate) {
            if (!targetDate) targetDate = new Date();
            var statusDot = document.getElementById('liveStatusDot');
            var statusText = document.getElementById('liveStatusText');

            updateLocalDates(targetDate);

            var citySelector = document.getElementById('mobileCitySelector');
            var selectedCity = citySelector ? citySelector.value : 'Cairo';
            var selectedCityLabel = (citySelector && citySelector.selectedIndex >= 0)
                ? citySelector.options[citySelector.selectedIndex].text
                : 'القاهرة';

            var toolbarCityTitle = document.getElementById('toolbarCityTitle');
            if (toolbarCityTitle) {
                toolbarCityTitle.textContent = 'ورقة نتيجة يومية ومواقيت الصلاة — ' + selectedCityLabel;
            }
            var prayerCityHeading = document.getElementById('prayerCityHeading');
            if (prayerCityHeading) {
                prayerCityHeading.textContent = 'مواقيت الصلاة — ' + selectedCityLabel;
            }

            statusDot.style.backgroundColor = '#E8CF88';
            statusText.textContent = 'جاري جلب مواقيت ' + selectedCityLabel + '...';

            var dd = padTwo(targetDate.getDate());
            var mm = padTwo(targetDate.getMonth() + 1);
            var yyyy = targetDate.getFullYear();
            var dateParam = dd + '-' + mm + '-' + yyyy;
            var apiUrl = 'https://api.aladhan.com/v1/timingsByCity/' + dateParam +
                         '?city=' + encodeURIComponent(selectedCity) + '&country=Egypt&method=5';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', apiUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var json = JSON.parse(xhr.responseText);
                        if (json.code === 200 && json.data) {
                            var timings = json.data.timings;
                            var hijri = json.data.date.hijri;

                            var prayersMap = [
                                { key: 'Fajr', timeId: 'fajrTime', periodId: 'fajrPeriod' },
                                { key: 'Sunrise', timeId: 'sunriseTime', periodId: 'sunrisePeriod' },
                                { key: 'Dhuhr', timeId: 'dhuhrTime', periodId: 'dhuhrPeriod' },
                                { key: 'Asr', timeId: 'asrTime', periodId: 'asrPeriod' },
                                { key: 'Maghrib', timeId: 'maghribTime', periodId: 'maghribPeriod' },
                                { key: 'Isha', timeId: 'ishaTime', periodId: 'ishaPeriod' }
                            ];

                            for (var i = 0; i < prayersMap.length; i++) {
                                var item = prayersMap[i];
                                var formatted = formatPrayerTime12h(timings[item.key]);
                                document.getElementById(item.timeId).textContent = formatted.time;
                                document.getElementById(item.periodId).textContent = formatted.period;
                            }

                            if (hijri) {
                                var hDayClean = parseInt(hijri.day, 10);
                                var hMonthAr = HIJRI_MONTHS[hijri.month.number] || hijri.month.ar;
                                document.getElementById('hijriDayDisplay').textContent = toArabicDigits(hDayClean);
                                document.getElementById('hijriMonthDisplay').textContent = hMonthAr;
                                document.getElementById('hijriYearDisplay').textContent = toArabicDigits(hijri.year) + ' هـ';
                            }

                            statusDot.style.backgroundColor = '#34D399';
                            statusText.textContent = 'محدث مباشرة • توقيت ' + selectedCityLabel;
                            return;
                        }
                    } catch (e) {}
                }
                statusDot.style.backgroundColor = '#F59E0B';
                statusText.textContent = 'تعذر تحديث مواقيت ' + selectedCityLabel;
            };
            xhr.send();
        }

        function getCairoNow() {
            try {
                var cairoStr = new Date().toLocaleString('en-US', { timeZone: 'Africa/Cairo' });
                var d = new Date(cairoStr);
                if (!isNaN(d.getTime())) return d;
            } catch (e) {}
            return new Date();
        }

        function resetToToday() {
            var cairoToday = getCairoNow();
            var todayValue = getCairoTodayValue();

            var dateInput = document.getElementById('dateSelector');
            if (dateInput) dateInput.value = todayValue;
            var mobileDateInput = document.getElementById('mobileDateSelector');
            if (mobileDateInput) mobileDateInput.value = todayValue;

            fetchCairoLiveData(cairoToday);
        }

        function scaleCalendarSheet() {
            var wrapper = document.getElementById('sheetWrapper');
            var sheet = document.getElementById('calendarSheet');
            var toolbar = document.querySelector('.toolbar');
            if (!wrapper || !sheet) return;

            var viewportWidth = document.documentElement.clientWidth || window.innerWidth;
            var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
            var isMobileLayout = viewportWidth <= 640;

            if (isMobileLayout) {
                removeClassName(document.body, 'widescreen-16-9');
                wrapper.style.width = '100%';
                wrapper.style.height = 'auto';
                wrapper.style.maxWidth = '520px';
                sheet.style.position = 'relative';
                sheet.style.top = 'auto';
                sheet.style.left = 'auto';
                sheet.style.width = '100%';
                sheet.style.height = 'auto';
                sheet.style.webkitTransform = 'none';
                sheet.style.transform = 'none';
                if (toolbar) {
                    toolbar.style.width = '';
                    toolbar.style.maxWidth = '';
                }
                return;
            }

            var aspectRatio = viewportWidth / Math.max(1, viewportHeight);
            var use16By9 = viewportWidth >= 1024 && aspectRatio >= 1.58;

            if (use16By9) {
                addClassName(document.body, 'widescreen-16-9');
            } else {
                removeClassName(document.body, 'widescreen-16-9');
            }

            var baseWidth = use16By9 ? 1920 : 1536;
            var baseHeight = use16By9 ? 1080 : 1024;

            sheet.style.position = 'absolute';
            sheet.style.top = '0px';
            sheet.style.left = '0px';
            sheet.style.width = baseWidth + 'px';
            sheet.style.height = baseHeight + 'px';
            sheet.style.webkitTransformOrigin = 'top left';
            sheet.style.transformOrigin = 'top left';

            var toolbarHeight = toolbar ? (toolbar.offsetHeight + 16) : 0;
            var availableWidth = Math.max(320, viewportWidth - 28);
            var availableHeight = Math.max(240, viewportHeight - toolbarHeight - 28);

            var scale = Math.min(availableWidth / baseWidth, availableHeight / baseHeight);
            var renderedWidth = Math.floor(baseWidth * scale);
            var renderedHeight = Math.floor(baseHeight * scale);

            wrapper.style.maxWidth = 'none';
            wrapper.style.width = renderedWidth + 'px';
            wrapper.style.height = renderedHeight + 'px';
            sheet.style.webkitTransform = 'scale(' + scale + ')';
            sheet.style.transform = 'scale(' + scale + ')';

            if (toolbar) {
                toolbar.style.maxWidth = 'none';
                toolbar.style.width = renderedWidth + 'px';
            }
        }

        function initApp() {
            scaleCalendarSheet();
            resetToToday();

            var dateInput = document.getElementById('dateSelector');
            if (dateInput) {
                dateInput.addEventListener('change', function (e) {
                    if (e.target.value) {
                        var parts = e.target.value.split('-');
                        var selectedDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                        fetchCairoLiveData(selectedDate);
                    }
                });
            }

            var mobileCitySelector = document.getElementById('mobileCitySelector');
            var mobileCitySearch = document.getElementById('mobileCitySearch');
            var governoratePickerButton = document.getElementById('governoratePickerButton');
            var governorateDropdown = document.getElementById('governorateDropdown');
            var governorateOptions = document.getElementById('governorateOptions');
            var governorateSelectedLabel = document.getElementById('governorateSelectedLabel');

            var desktopPicker = document.getElementById('desktopGovernoratePicker');
            var desktopButton = document.getElementById('desktopGovernorateButton');
            var desktopDropdown = document.getElementById('desktopGovernorateDropdown');
            var desktopSearch = document.getElementById('desktopGovernorateSearch');
            var desktopOptions = document.getElementById('desktopGovernorateOptions');
            var desktopLabel = document.getElementById('desktopGovernorateLabel');

            if (mobileCitySelector) {
                var governorates = [];
                for (var i = 0; i < mobileCitySelector.options.length; i++) {
                    governorates.push({
                        value: mobileCitySelector.options[i].value,
                        text: (mobileCitySelector.options[i].textContent || '').replace(/^\s+|\s+$/g, '')
                    });
                }

                function selectCity(item) {
                    mobileCitySelector.value = item.value;
                    if (desktopLabel) desktopLabel.textContent = item.text;
                    if (governorateSelectedLabel) governorateSelectedLabel.textContent = item.text;
                    if (desktopDropdown) desktopDropdown.hidden = true;
                    if (desktopButton) desktopButton.setAttribute('aria-expanded', 'false');
                    if (governorateDropdown) governorateDropdown.hidden = true;
                    if (governoratePickerButton) governoratePickerButton.setAttribute('aria-expanded', 'false');

                    var currentDateValue = dateInput ? dateInput.value : '';
                    var selectedDate = getCairoNow();
                    if (currentDateValue) {
                        var p = currentDateValue.split('-');
                        selectedDate = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
                    }
                    fetchCairoLiveData(selectedDate);
                    toggleSettings(false);
                }

                function renderList(container, emptyClass, optionClass, query) {
                    if (!container) return;
                    var q = (query || '').replace(/^\s+|\s+$/g, '').toLowerCase();
                    while (container.firstChild) {
                        container.removeChild(container.firstChild);
                    }
                    var count = 0;
                    for (var j = 0; j < governorates.length; j++) {
                        var item = governorates[j];
                        if (item.text.toLowerCase().indexOf(q) === -1) continue;
                        count++;
                        (function (cityItem) {
                            var btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = optionClass;
                            btn.textContent = cityItem.text;
                            btn.setAttribute('aria-selected', String(cityItem.value === mobileCitySelector.value));
                            btn.addEventListener('click', function () {
                                selectCity(cityItem);
                            });
                            container.appendChild(btn);
                        })(item);
                    }
                    if (count === 0) {
                        var empty = document.createElement('div');
                        empty.className = emptyClass;
                        empty.textContent = 'لا توجد محافظة بهذا الاسم';
                        container.appendChild(empty);
                    }
                }

                renderList(governorateOptions, 'governorate-empty', 'governorate-option', '');
                renderList(desktopOptions, 'desktop-governorate-empty', 'desktop-governorate-option', '');

                if (desktopButton && desktopDropdown && desktopSearch) {
                    desktopButton.addEventListener('click', function () {
                        var opening = desktopDropdown.hidden;
                        desktopDropdown.hidden = !opening;
                        desktopButton.setAttribute('aria-expanded', String(opening));
                        if (opening) {
                            desktopSearch.value = '';
                            renderList(desktopOptions, 'desktop-governorate-empty', 'desktop-governorate-option', '');
                            desktopSearch.focus();
                        }
                    });
                    desktopSearch.addEventListener('input', function () {
                        renderList(desktopOptions, 'desktop-governorate-empty', 'desktop-governorate-option', desktopSearch.value);
                    });
                }

                if (governoratePickerButton && governorateDropdown && mobileCitySearch) {
                    governoratePickerButton.addEventListener('click', function () {
                        var opening = governorateDropdown.hidden;
                        governorateDropdown.hidden = !opening;
                        governoratePickerButton.setAttribute('aria-expanded', String(opening));
                        if (opening) {
                            mobileCitySearch.value = '';
                            renderList(governorateOptions, 'governorate-empty', 'governorate-option', '');
                            mobileCitySearch.focus();
                        }
                    });
                    mobileCitySearch.addEventListener('input', function () {
                        renderList(governorateOptions, 'governorate-empty', 'governorate-option', mobileCitySearch.value);
                    });
                }

                document.addEventListener('click', function (event) {
                    if (desktopPicker && desktopDropdown && !desktopPicker.contains(event.target) && !desktopDropdown.hidden) {
                        desktopDropdown.hidden = true;
                        if (desktopButton) desktopButton.setAttribute('aria-expanded', 'false');
                    }
                    var picker = document.getElementById('governoratePicker');
                    if (picker && governorateDropdown && !picker.contains(event.target) && !governorateDropdown.hidden) {
                        governorateDropdown.hidden = true;
                        if (governoratePickerButton) governoratePickerButton.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            var mobileDateInput = document.getElementById('mobileDateSelector');
            if (mobileDateInput) {
                mobileDateInput.addEventListener('change', function (e) {
                    if (e.target.value) {
                        var parts = e.target.value.split('-');
                        var selectedDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                        if (dateInput) dateInput.value = e.target.value;
                        mobileDateInput.value = e.target.value;
                        fetchCairoLiveData(selectedDate);
                        toggleSettings(false);
                    }
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        window.addEventListener('load', scaleCalendarSheet);
        window.addEventListener('resize', scaleCalendarSheet);
        window.addEventListener('orientationchange', function () {
            scaleCalendarSheet();
            setTimeout(scaleCalendarSheet, 250);
            setTimeout(scaleCalendarSheet, 600);
        });
        window.addEventListener('beforeprint', function () {
            var sheet = document.getElementById('calendarSheet');
            var wrapper = document.getElementById('sheetWrapper');
            if (sheet && wrapper) {
                var baseWidth = hasClassName(document.body, 'widescreen-16-9') ? 1920 : 1536;
                var scale = wrapper.clientWidth / baseWidth;
                sheet.style.webkitTransform = 'scale(' + scale + ')';
                sheet.style.transform = 'scale(' + scale + ')';
            }
        });
        window.addEventListener('afterprint', scaleCalendarSheet);
    </script>
</body>
</html>
